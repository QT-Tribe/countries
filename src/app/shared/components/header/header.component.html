<header
  class="flex justify-between items-center px-4 shadow-md bg-white dark:bg-grey-600"
>
  <h2
    class="font-sans text-2xl font-extrabold leading-tight tracking-normal pl-20 pt-6 pb-6"
  >
    Where in the world?
  </h2>

  <button
    class="cursor-pointer flex items-center gap-2"
    (click)="toggleTheme()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-6 h-6"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
      />
    </svg>
    <span
      class="font-sans text-base font-semibold leading-snug tracking-normal pr-20 pt-6 pb-6"
      >Dark Mode</span
    >
  </button>
</header>
